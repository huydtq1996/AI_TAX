<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trợ lý Khai báo Thuế & Quản lý Kế hoạch</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1><i class="fa-solid fa-robot"></i> AI Trợ lý Khai báo Thuế</h1>
                <p>Dành cho Hộ Kinh doanh Nhỏ - Tư duy Trí tuệ Nhân tạo</p>
            </div>
        </header>

        <main class="main-content">
            <div class="chat-section">
                <div class="chat-window" id="chatWindow">
                    <div class="message ai-message">
                        <div class="message-avatar"><i class="fa-solid fa-robot"></i></div>
                        <div class="message-bubble">
                            <p>Xin chào! Tôi là AI Trợ lý Khai báo Thuế. Tôi có thể giúp bạn tra cứu luật thuế, tính thuế hoặc lập kế hoạch kinh doanh.</p>
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <form id="chatForm" class="chat-form">
                        <button type="button" class="icon-button voice-btn" id="voiceBtn" title="Nhập bằng giọng nói">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <button type="button" class="icon-button file-btn" title="Đính kèm file/ảnh">
                            <i class="fa-solid fa-paperclip"></i>
                        </button>
                        <input type="text" id="chatInput" placeholder="Hỏi đáp tiếng Việt (VD: Doanh thu 150tr/năm thì nộp thuế bao nhiêu?)..." required autocomplete="off">
                        <button type="submit" class="primary-button send-btn">
                            <i class="fa-solid fa-paper-plane"></i> Gửi
                        </button>
                    </form>
                </div>
            </div>

            <div class="side-panel">
                <div class="card tax-calc-card">
                    <h3><i class="fa-solid fa-calculator"></i> Tính thuế nhanh</h3>
                    <form id="taxForm" class="tax-form">
                        <div class="form-group">
                            <label>Doanh thu năm (VNĐ):</label>
                            <input type="number" id="revenueInput" placeholder="VD: 150000000" required>
                        </div>
                        <div class="form-group">
                            <label>Ngành nghề:</label>
                            <select id="categoryInput">
                                <option value="phan_phoi_cung_cap_hang_hoa">Phân phối, cung cấp hàng hóa</option>
                                <option value="dich_vu_xay_dung_khong_bao_thau">Dịch vụ, xây dựng không bao thầu</option>
                                <option value="san_xuat_van_tai_dich_vu_co_hang_hoa">Sản xuất, vận tải, dịch vụ có gắn hàng hóa</option>
                                <option value="hoat_dong_khac">Hoạt động khác</option>
                            </select>
                        </div>
                        <button type="submit" class="secondary-button">Tính Thuế & Tư Vấn</button>
                    </form>
                </div>

                <div class="card result-card" id="taxResultCard" style="display: none;">
                    <h3>Kết quả Tính Thuế</h3>
                    <div id="taxResultContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
